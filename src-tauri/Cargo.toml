[package]
name = "rocktier-markdown"
version = "0.1.0"
description = "Fast, elegant Markdown reader and editor"
authors = ["Rocktier"]
edition = "2021"

[lib]
name = "rocktier_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
# Required by tauri::generate_context! (macro references ::serde_json directly)
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Size- and startup-optimized release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
