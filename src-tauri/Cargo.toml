[package]
name = "rocktier-markdown"
version = "1.0.1"
description = "Fast, elegant Markdown reader and editor"
authors = ["Rocktier"]
edition = "2021"

[lib]
name = "rocktier_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri-plugin-opener = "2"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
# Required by tauri::generate_context! (macro references ::serde_json directly)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 粘贴图片落盘时解码 base64（tauri 传递依赖里已有同版本，不引入新下载）
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Size- and startup-optimized release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
