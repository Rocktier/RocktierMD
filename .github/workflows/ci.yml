name: Checks

# MD 此前唯一的 push 工作流是 notify-family-gate：build.yml 只在 tag / 手动
# 触发，且手动派发的发布无闸门（2026-10-16 阶段 51 只能开一次性 verify 标签
# 应急）。2026-10-16（UX 审计轮发现，task_plan P0''，用户拍板）把 build.yml 里
# 已被发版反复跑绿的「Tests & Lints」作业原样挂到 push —— 配方零改动，
# 只换触发条件。与 Sign / OCR 的 ci.yml 同配方。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure clippy component
        # dtolnay action 的 components: clippy 在部分 macOS runner 镜像上装不到
        # 活动 toolchain（CAD db7b5fc 曾报 cargo-clippy is not installed for
        # 1.98.0，而同配方的 pic2webp/MD 同一晚却过了 —— 镜像状态差异）。
        # 显式对当前 toolchain 补装，幂等，防复发。
        run: rustup component add clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
