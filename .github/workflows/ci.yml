name: Checks

# MD 此前唯一的 push 工作流是 notify-family-gate：build.yml 只在 tag / 手动
# 触发，且手动派发的发布无闸门（2026-10-16 阶段 51 只能开一次性 verify 标签
# 应急）。2026-10-16（UX 审计轮发现，task_plan P0''，用户拍板）把 build.yml 里
# 已被发版反复跑绿的「Tests & Lints」作业原样挂到 push —— 配方零改动，
# 只换触发条件。与 Sign / OCR 的 ci.yml 同配方。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure clippy component
        # dtolnay action 的 components: clippy 在部分 macOS runner 镜像上装不到
        # 活动 toolchain（CAD db7b5fc 曾报 cargo-clippy is not installed for
        # 1.98.0，而同配方的 pic2webp/MD 同一晚却过了 —— 镜像状态差异）。
        # 显式对当前 toolchain 补装，幂等，防复发。
        run: rustup component add clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: Glass contrast (lenso material)
        # 玻璃是半透明的：家族 contrast-gate 的「令牌 × 表面」矩阵看不见它
        # （矩阵里的表面全是不透明令牌值）。这条闸门按真实叠层合成后算
        # 对比度，并做一次「把玻璃调薄」的正反对照。
        run: npm run verify:glass
      - name: fs permission audit
        # v1.0.21 的 P0：导出 HTML 内联本地图依赖 readFile（二进制读），
        # 而 capabilities 只授了 read-text-file —— 运行时被 ACL 拒、被 catch
        # 吞掉，单测全绿而产物是空壳（D-140/D-142）。此处对账「源码要的 fs API」
        # 与「配置给的权限」，带正反对照。
        run: npm run verify:fs
      - name: Tab limit toast discipline
        # v1.0.21 的 P2：12 标签时点 + 不新建、却弹绿色 "New document"，
        # 因为调用方没判 openInTab 的返回值（D-141/T7）。纯逻辑单测抓不到
        # 「谁调它、有没有看回执」，所以这里盯调用点形态。
        run: npm run verify:tabs
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
