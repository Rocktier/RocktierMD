name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v1.0.0). Required for manual runs — without it the workflow uploads to the branch name.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    name: Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: macOS (Apple Silicon)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build DMG
        run: |
          npm ci
          npm run tauri build
      - name: Ensure Release Exists
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload DMG to Release
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/release/bundle/dmg/*.dmg --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (MSI + MSIX)
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          # tauri-windows-bundle builds with an explicit --target, so the target
          # has to be present.
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build MSI + NSIS installers
        run: npm run tauri build
      - name: Build MSIX (for Microsoft Store)
        run: npm run tauri:windows:build
      # The macOS job usually wins the race, but a Windows-only re-run would
      # otherwise have nothing to upload to.
      - name: Ensure Release Exists
        shell: bash
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MSI / NSIS to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*.exe --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tauri-windows-bundle writes to src-tauri/target/msix/, NOT to
      # src-tauri/gen/windows/output/ — gen/windows/ only holds the inputs
      # (bundle.config.json, AppxManifest.xml.template, Assets/). A wrong glob
      # here fails silently: nothing is uploaded and nobody is told.
      - name: Upload MSIX to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/msix/*.msix* --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
