name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v1.0.0). Required for manual runs — without it the workflow uploads to the branch name.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: macOS (Apple Silicon)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build DMG
        run: |
          npm ci
          npm run tauri build
      - name: Ensure Release Exists
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --draft --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload DMG to Release
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/release/bundle/dmg/*.dmg --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + upload app.zip to Release
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Markdown.app.zip"
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} "Rocktier.Markdown.app.zip" --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (MSI + MSIX)
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20, matching the two family projects whose MSIX actually packs. Only the
          # checks job needs a newer Node (jsdom), and this one does not run vitest.
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          # tauri-windows-bundle builds with an explicit --target, so the target
          # has to be present.
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build MSI + NSIS installers
        run: npm run tauri build
      - name: Build MSIX (for Microsoft Store)
        # ROCKTIER_CHANNEL=store turns off the app's own trial and activation
        # entirely: the Store sold this copy and the Store knows it. Leaving our
        # paywall in would pull in Microsoft's third-party-purchase rules (10.8.2)
        # and its disclosure requirements (10.8.4) for no reason.
        #
        # The step above builds msi/nsis with no such variable, so those stay on
        # the default `direct` channel. rustc records option_env! lookups in its
        # dep-info, so changing this variable is enough to force a rebuild.
        env:
          ROCKTIER_CHANNEL: store
        run: npm run tauri:windows:build
      # The macOS job usually wins the race, but a Windows-only re-run would
      # otherwise have nothing to upload to.
      - name: Ensure Release Exists
        shell: bash
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --draft --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MSI / NSIS to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*.exe --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tauri-windows-bundle writes to src-tauri/target/msix/, NOT to
      # src-tauri/gen/windows/output/ — gen/windows/ only holds the inputs
      # (bundle.config.json, AppxManifest.xml.template, Assets/). A wrong glob
      # here fails silently: nothing is uploaded and nobody is told.
      - name: Upload MSIX to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/msix/*.msix* --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  # 逻辑统一，仅 REQUIRED_ASSETS 按各产品实际产物定制（见 env）。
  publish:
    name: Verify & Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          for i in $(seq 1 18); do
            # 保留 || true 仅为让轮询能继续重试（资产 API 确实会 lag），
            # 但**必须把 stderr 打出来** —— 之前 `2>/dev/null` 把它一并丢掉，
            # 于是 gh 的真实错误（权限 / 仓库名 / Rate limit）被伪装成
            # 「资产还没上传」，报错信息完全指错方向，排查方向整个跑偏。
            # 实测踩过：MD v1.0.7 / CAD v0.2.5 / Journal v0.2.7 三个仓资产其实齐全，
            # 校验却报「六个包全缺」—— 就是这一行。修复沿用 Write 仓的写法。
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 10
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
